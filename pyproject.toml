[project]
name = "langchain-medical-agent"
version = "0.1.0"
description = "Agent 医疗知识图谱问答系统"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jieba>=0.42.1",
    "langchain>=1.4.0",
    "langchain-openai>=1.6.2",
    "langchain-postgres>=0.0.18",
    "neo4j>=6.3.1",
    "path>=17.1.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "redis>=8.1.0",
    "retry>=0.9.2",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.53.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]
